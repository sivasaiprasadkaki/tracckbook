<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackBook Splash Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .splash-viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f8fafc 55%, #edf2f7 100%);
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* 1. App Icon Card: Premium Floating White Squircle */
        .app-icon {
            width: 170px;
            height: 170px;
            background: #ffffff;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 
                0 25px 50px -12px rgba(15, 23, 42, 0.12),
                0 8px 24px -4px rgba(15, 23, 42, 0.06),
                0 0 0 1px rgba(15, 23, 42, 0.05);
            transform: scale(0);
            animation: tbZoomInIcon 0.52s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            will-change: transform;
        }

        /* 2. Logo Artwork Canvas (120x120) */
        .logo-art {
            position: relative;
            width: 120px;
            height: 120px;
            perspective: 600px;
        }

        /* 3. Ground Impact Glow & Ripples */
        .impact-glow {
            position: absolute;
            bottom: 12px;
            left: 25px;
            width: 70px;
            height: 14px;
            background: radial-gradient(ellipse at center, rgba(11, 28, 51, 0.28) 0%, rgba(16, 185, 129, 0.25) 45%, transparent 75%);
            border-radius: 50%;
            transform: scale(0.25);
            opacity: 0;
            animation: tbImpactShockwave 0.45s 0.68s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            pointer-events: none;
            z-index: 1;
        }

        .impact-glow::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            opacity: 0;
            animation: tbRingExpand 0.42s 0.68s ease-out forwards;
        }

        /* 4. The Unified Book & "T" Entity (Falls and Bounces) */
        .book-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            height: 80px;
            opacity: 0;
            transform-origin: center bottom;
            transform: translateY(-260px) scaleY(1.3) scaleX(0.9);
            animation: tbGravityFallT 0.68s 0.3s cubic-bezier(0.32, 0.08, 0.15, 1) forwards;
            z-index: 2;
            will-change: transform, opacity;
        }

        /* Top Crossbar of the "T" (Spans the entire book header) */
        .t-crossbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 16px;
            background: #0B1C33;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(11, 28, 51, 0.22);
            z-index: 5;
        }

        /* White bookmark/page-edge accent line on the crossbar */
        .t-crossbar::after {
            content: '';
            position: absolute;
            top: 3.5px;
            left: 8px;
            width: 64px;
            height: 2.5px;
            background-color: #ffffff;
            border-radius: 2px;
            opacity: 0.95;
        }

        /* Left Book Cover / Wing (Deep Navy, seamless with the T) */
        .left-cover {
            position: absolute;
            top: 14px;
            left: 2px;
            width: 30px;
            height: 64px;
            background: linear-gradient(135deg, #071526 0%, #0B1C33 100%);
            border-radius: 0 0 4px 8px;
            box-shadow: -2px 4px 10px rgba(11, 28, 51, 0.15);
            z-index: 3;
        }

        /* Subtle vertical spine groove */
        .left-cover::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 5px;
            width: 2px;
            height: 52px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 1px;
        }

        /* Center Vertical Stem of the "T" (Standing bold & proud down the middle) */
        .t-stem {
            position: absolute;
            top: 14px;
            left: 29px;
            width: 22px;
            height: 64px;
            background: #0B1C33;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 12px rgba(11, 28, 51, 0.28);
            z-index: 6;
        }

        /* Center stem inner lighting */
        .t-stem::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 3px;
            width: 2px;
            height: 54px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1px;
        }

        /* 5. Right Green Ledger Pages (Flips open smoothly from the central stem) */
        .green-pages {
            position: absolute;
            top: 15px;
            left: 49px;
            width: 29px;
            height: 63px;
            background: #10B981;
            border-radius: 0 0 8px 0;
            transform-origin: left center;
            transform: rotateY(-100deg) scale(0.85);
            opacity: 0;
            animation: tbFlipOpenPages 0.85s 0.72s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            z-index: 4;
            will-change: transform, opacity;
            box-shadow: 
                -2px 0 6px rgba(0, 0, 0, 0.1),
                0 6px 16px rgba(16, 185, 129, 0.32);
        }

        /* Subtle left inner shadow gradient simulating the spine fold */
        .green-pages::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.02) 20%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* 6. Crisp White Checklist Lines (Guaranteed 100% Solid & Visible) */
        .page-line {
            width: 17px;
            height: 3px;
            background: #ffffff;
            border-radius: 2px;
            opacity: 0;
            transform: translateX(8px);
            z-index: 2;
            position: relative;
        }

        .page-line:nth-child(1) { animation: tbShowLine 0.25s 1.10s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .page-line:nth-child(2) { animation: tbShowLine 0.25s 1.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .page-line:nth-child(3) { width: 12px; animation: tbShowLine 0.25s 1.34s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* 7. Typography - TrackBook */
        .brand-text {
            margin-top: 34px;
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
            opacity: 0;
            transform: translateY(18px);
            animation: tbFadeUpText 0.72s 1.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-text span {
            color: #10B981;
            font-weight: 700;
        }

        .brand-subtitle {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #64748b;
            opacity: 0;
            transform: translateY(10px);
            animation: tbFadeUpText 0.65s 1.50s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ================= KEYFRAME ANIMATIONS ================= */
        @keyframes tbZoomInIcon {
            0% {
                transform: scale(0.35);
                opacity: 0;
            }
            70% {
                transform: scale(1.04);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes tbGravityFallT {
            0% {
                transform: translateY(-260px) scaleY(1.3) scaleX(0.9);
                opacity: 0;
            }
            64% {
                transform: translateY(0px) scaleY(1.14) scaleX(0.93);
                opacity: 1;
            }
            68% {
                transform: translateY(3px) scaleY(0.84) scaleX(1.16);
                opacity: 1;
            }
            80% {
                transform: translateY(-8px) scaleY(1.05) scaleX(0.98);
                opacity: 1;
            }
            92% {
                transform: translateY(1.5px) scaleY(0.98) scaleX(1.01);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scaleY(1) scaleX(1);
                opacity: 1;
            }
        }

        @keyframes tbImpactShockwave {
            0% {
                transform: scale(0.25);
                opacity: 0.85;
            }
            45% {
                opacity: 0.55;
            }
            100% {
                transform: scale(1.65);
                opacity: 0;
            }
        }

        @keyframes tbRingExpand {
            0% {
                transform: scale(0.35);
                opacity: 0.85;
            }
            100% {
                transform: scale(2.3);
                opacity: 0;
            }
        }

        @keyframes tbFlipOpenPages {
            0% {
                transform: rotateY(-100deg) scale(0.85);
                opacity: 0;
            }
            30% {
                opacity: 1;
            }
            70% {
                transform: rotateY(10deg) scale(1.02);
                opacity: 1;
            }
            86% {
                transform: rotateY(-3deg) scale(0.99);
                opacity: 1;
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: drop-shadow(-1px 3px 8px rgba(16, 185, 129, 0.28));
            }
        }

        @keyframes tbShowLine {
            0% {
                opacity: 0;
                transform: translateX(8px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes tbFadeUpText {
            0% {
                opacity: 0;
                transform: translateY(18px);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0px);
            }
        }
    </style>
</head>
<body>
    <div class="splash-viewport">
        <div class="splash-container">
            <div class="app-icon">
                <div class="logo-art">
                    <!-- Ground impact shockwave ripple -->
                    <div class="impact-glow"></div>
                    
                    <!-- The Unified Book & "T" Entity -->
                    <div class="book-container">
                        <!-- Top Crossbar of the "T" -->
                        <div class="t-crossbar"></div>
                        
                        <!-- Left Navy Book Cover / Leaf -->
                        <div class="left-cover"></div>
                        
                        <!-- Center Bold Vertical Stem of the "T" -->
                        <div class="t-stem"></div>
                        
                        <!-- Right Emerald Green Ledger Pages with 3 Crisp White Lines -->
                        <div class="green-pages">
                            <div class="page-line"></div>
                            <div class="page-line"></div>
                            <div class="page-line"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Brand Wordmark Typography in Light Mode -->
            <div class="brand-text">Track<span>Book</span></div>
            <div class="brand-subtitle">Smart Financial Tracking</div>
        </div>
    </div>

    <!-- Hard freeze against scroll bounce -->
    <script>
        const preventScroll = (e) => { e.preventDefault(); };
        window.addEventListener('wheel', preventScroll, { passive: false });
        window.addEventListener('touchmove', preventScroll, { passive: false });
        document.addEventListener('gesturestart', preventScroll);
    </script>
</body>
</html>
