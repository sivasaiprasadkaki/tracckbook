  <path d="M 86,155 Q 131,140 176,155" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Ledger Lines on Right Page (Deep Navy) -->
  <path d="M 336,125 Q 381,110 426,125" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 336,155 Q 381,140 426,155" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
