<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- T-Emblem Gradient: Vibrant Emerald Green -->
    <linearGradient id="tGradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D depth -->
    <filter id="shadowTrans" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>

    <filter id="tShadowTrans" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064E3B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Open Book Base / Pages -->
  <!-- Left Page -->
  <path d="M 94,214 Q 180,188 248,204 L 248,382 Q 180,366 94,392 Z" fill="#FFFFFF" filter="url(#shadowTrans)"/>
  
  <!-- Right Page -->
  <path d="M 418,214 Q 332,188 264,204 L 264,382 Q 332,366 418,392 Z" fill="#F1F5F9" filter="url(#shadowTrans)"/>

  <!-- Book Spine / Fold Center -->
  <path d="M 248,204 Q 256,208 264,204 L 264,382 Q 256,386 248,382 Z" fill="#CBD5E1"/>

  <!-- Ledger Lines on Left Page -->
  <line x1="124" y1="254" x2="218" y2="242" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
  <line x1="124" y1="288" x2="218" y2="276" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
  <line x1="124" y1="322" x2="218" y2="310" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>

  <!-- Ledger Lines on Right Page -->
  <line x1="294" y1="242" x2="388" y2="254" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="276" x2="388" y2="288" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="310" x2="388" y2="322" stroke="#94A3B8" stroke-width="7" stroke-linecap="round"/>

  <!-- Prominent "T" Emblem across the Book -->
  <g filter="url(#tShadowTrans)">
    <!-- Top Bar of T -->
    <rect x="136" y="104" width="240" height="58" rx="16" fill="url(#tGradTrans)"/>
    <!-- Vertical Stem of T -->
    <rect x="227" y="104" width="58" height="236" rx="16" fill="url(#tGradTrans)"/>
    <!-- Inner T Accent Line -->
    <rect x="148" y="114" width="216" height="8" rx="4" fill="#A7F3D0" opacity="0.6"/>
  </g>
</svg>
