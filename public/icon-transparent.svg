<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertical Stem of the T / Spine of the Book (Emerald Green) -->
  <rect x="216" y="90" width="80" height="342" rx="20" fill="#10B981"/>
  
  <!-- Left Page of the Ledger (White) -->
  <path d="M 56,100 Q 131,75 206,100 L 206,190 Q 131,165 56,190 Z" fill="#FFFFFF"/>
  
  <!-- Right Page of the Ledger (White) -->
